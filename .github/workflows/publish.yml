name: publish

# 1) 海外ソースを集める → 2) 書く価値のある新しい候補があるときだけ記者（Opus）が書いてコミット → 3) ビルドして GitHub Pages に公開
# push（手元からの記事追加・修正）では 3) だけ行う。
# 毎時走るが、Claude を呼ぶのは collect.py の gate（大手の一次情報の出たて・複数媒体が報じている等でスコアが閾値以上）を通った回だけ。
# 1日の本数は MAX_PER_DAY で頭打ちにする（Claude の利用枠と記事の質の両方を守るため）
on:
  push:
    branches: [main]
  schedule:
    - cron: "5 * * * *" # 毎時5分（米国の発表から1〜2時間以内に出すため。書くかどうかは gate が決める）
  workflow_dispatch:
    inputs:
      write:
        description: "Claude に記事を書かせる（gate を通さず必ず書く）"
        type: boolean
        default: true
      count:
        description: "最大で何本書くか"
        default: "2"
      hours:
        description: "候補を集める時間幅（時間）"
        default: "24"

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write # Pages のデプロイと Claude GitHub App の認証に必要

env:
  ARTICLES_PER_RUN: ${{ inputs.count || '2' }}
  COLLECT_HOURS: ${{ inputs.hours || '24' }}
  MAX_PER_DAY: 12 # 1日の記事数の上限（速報を優先し、薄い記事で埋めない）
  GATE_SCORE: "2.6" # collect.py --gate の閾値。下げると書く回数が増える
  WRITER_MODEL: claude-opus-5-5 # 記事の執筆モデル（固定）
  WANT_WRITE: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.write) }}
  HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: git identity
        run: |
          git config user.name "aidejima-bot"
          git config user.email "aidejima-bot@users.noreply.github.com"

      # 記事のOG画像は内容が同じなら再利用する。X の since_id（読み取り課金を抑える）もここに入る
      - uses: actions/cache@v4
        with:
          path: .cache
          key: cache-${{ github.run_id }}
          restore-keys: |
            cache-
            og-

      - name: 海外ソースを収集して、書く価値があるか判定
        if: env.WANT_WRITE == 'true'
        id: gate
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }} # 未設定なら X はスキップされる
        run: |
          today=$(TZ=Asia/Tokyo date +%Y%m%d)
          done_today=$(ls content/articles/${today}-*.md 2>/dev/null | wc -l | tr -d ' ')
          echo "今日の記事数: ${done_today} / 上限 ${MAX_PER_DAY}"
          if python3 scripts/collect.py --hours "$COLLECT_HOURS" --print 25 --gate --gate-score "$GATE_SCORE"; then
            gate=true
          else
            gate=false
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            gate=true
          fi
          if [ "$done_today" -ge "$MAX_PER_DAY" ]; then
            echo "1日の上限に達したので今回は書かない"
            gate=false
          fi
          echo "write=$gate" >> "$GITHUB_OUTPUT"

      - name: 執筆の指示を用意
        if: env.WANT_WRITE == 'true' && env.HAS_CLAUDE == 'true' && steps.gate.outputs.write == 'true'
        id: prompt
        run: |
          {
            echo "text<<PROMPT_EOF"
            sed "s/{{COUNT}}/${ARTICLES_PER_RUN}/" scripts/writer_prompt.md
            echo "PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: "記者（Opus）: 記事を書く"
        id: write
        if: env.WANT_WRITE == 'true' && env.HAS_CLAUDE == 'true' && steps.gate.outputs.write == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          claude_args: |
            --model ${{ env.WRITER_MODEL }}
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash,WebSearch,WebFetch"
            --max-turns 120
          prompt: ${{ steps.prompt.outputs.text }}

      # 上の回が失敗したとき（混雑・一時的なエラー）だけ、同じモデルでもう一度。
      # 書きかけの記事ファイルが残っていても、指示どおり既存記事を確認してから書くので二重にはならない
      - name: "記者（Opus）: 記事を書く（再試行）"
        if: steps.write.outcome == 'failure'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          claude_args: |
            --model ${{ env.WRITER_MODEL }}
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash,WebSearch,WebFetch"
            --max-turns 120
          prompt: ${{ steps.prompt.outputs.text }}

      - name: push
        if: env.WANT_WRITE == 'true'
        run: |
          if [ -n "$(git log origin/main..HEAD --oneline)" ]; then
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "新しいコミットなし"
          fi

      - name: build
        run: python3 build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: IndexNow と WebSub に通知
        run: python3 scripts/notify.py --hours 3
        continue-on-error: true
