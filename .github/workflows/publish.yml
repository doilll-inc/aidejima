name: publish

# 1) 海外ソースを集める → 2) 記者（Opus）がまだ記事にしていない話題を最大 ARTICLES_PER_RUN 本書いてコミット → 3) ビルドして GitHub Pages に公開
# 1日4回（7:00 / 12:00 / 17:00 / 21:00 JST）必ず更新する（tomo指示 2026-10-01「1日4回記事を更新してほしい」）。
# 7:00 は日本の夜のあいだに出た米国の発表を拾う回。書く価値のある話題がなければ記者は0本で終えてよい（無理に埋めない）。
# push（手元からの記事追加・修正やガイド点検のコミット）では 3) だけ行う。
# MAX_PER_DAY は手で記事を足した日にClaudeの利用枠を使いすぎないための安全弁
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 22 * * *" # 07:00 JST（米国の夜〜朝の発表）
    - cron: "0 3 * * *" # 12:00 JST
    - cron: "0 8 * * *" # 17:00 JST
    - cron: "0 12 * * *" # 21:00 JST（米国の朝の発表）
  workflow_dispatch:
    inputs:
      write:
        description: "Claude に記事を書かせる"
        type: boolean
        default: true
      count:
        description: "最大で何本書くか"
        default: "3"
      hours:
        description: "候補を集める時間幅（時間）"
        default: "24"

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write # Pages のデプロイと Claude GitHub App の認証に必要

env:
  ARTICLES_PER_RUN: ${{ inputs.count || '3' }}
  COLLECT_HOURS: ${{ inputs.hours || '24' }}
  MAX_PER_DAY: 20 # 1日の記事数の上限（4回×3本=12本が通常。手で足した日の使いすぎを防ぐ）
  WRITER_MODEL: claude-opus-5-5 # 記事の執筆モデル（固定）
  WANT_WRITE: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.write) }}
  HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: git identity
        run: |
          git config user.name "aidejima-bot"
          git config user.email "aidejima-bot@users.noreply.github.com"

      # 記事のOG画像は内容が同じなら再利用する。X の since_id（読み取り課金を抑える）もここに入る
      - uses: actions/cache@v4
        with:
          path: .cache
          key: cache-${{ github.run_id }}
          restore-keys: |
            cache-
            og-

      - name: 海外ソースを収集
        if: env.WANT_WRITE == 'true'
        id: gate
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }} # 未設定なら X はスキップされる
        run: |
          today=$(TZ=Asia/Tokyo date +%Y%m%d)
          done_today=$(ls content/articles/${today}-*.md 2>/dev/null | wc -l | tr -d ' ')
          echo "今日の記事数: ${done_today} / 上限 ${MAX_PER_DAY}"
          python3 scripts/collect.py --hours "$COLLECT_HOURS" --print 25
          # 1日4回の定時更新なので毎回書く（話題の良し悪しは記者が EDITORIAL.md の基準で判断し、無ければ0本）
          gate=true
          if [ "$done_today" -ge "$MAX_PER_DAY" ]; then
            echo "1日の上限に達したので今回は書かない"
            gate=false
          fi
          echo "write=$gate" >> "$GITHUB_OUTPUT"

      - name: 執筆の指示を用意
        if: env.WANT_WRITE == 'true' && env.HAS_CLAUDE == 'true' && steps.gate.outputs.write == 'true'
        id: prompt
        run: |
          {
            echo "text<<PROMPT_EOF"
            sed "s/{{COUNT}}/${ARTICLES_PER_RUN}/" scripts/writer_prompt.md
            echo "PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: "記者（Opus）: 記事を書く"
        id: write
        if: env.WANT_WRITE == 'true' && env.HAS_CLAUDE == 'true' && steps.gate.outputs.write == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Claude の GitHub アプリに頼らず、このワークフローの標準トークンで動かす（アプリがこのリポジトリに入っていなくても動くように）
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: true
          claude_args: |
            --model ${{ env.WRITER_MODEL }}
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash,WebSearch,WebFetch"
            --max-turns 120
          prompt: ${{ steps.prompt.outputs.text }}

      # 上の回が失敗したとき（混雑・一時的なエラー）だけ、同じモデルでもう一度。
      # 書きかけの記事ファイルが残っていても、指示どおり既存記事を確認してから書くので二重にはならない
      - name: "記者（Opus）: 記事を書く（再試行）"
        if: steps.write.outcome == 'failure'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Claude の GitHub アプリに頼らず、このワークフローの標準トークンで動かす（アプリがこのリポジトリに入っていなくても動くように）
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: true
          claude_args: |
            --model ${{ env.WRITER_MODEL }}
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash,WebSearch,WebFetch"
            --max-turns 120
          prompt: ${{ steps.prompt.outputs.text }}

      - name: push
        if: env.WANT_WRITE == 'true'
        run: |
          if [ -n "$(git log origin/main..HEAD --oneline)" ]; then
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "新しいコミットなし"
          fi

      - name: build
        run: python3 build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: IndexNow と WebSub に通知
        run: python3 scripts/notify.py --hours 3
        continue-on-error: true
